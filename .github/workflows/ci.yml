name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install development tools
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build and validate catalog
        run: npm run build:catalog

      - name: Verify generated catalog stays outside Git
        run: git check-ignore public/catalog.json

      - name: Verify Unix launchers are executable
        if: runner.os != 'Windows'
        shell: bash
        run: test -x start.sh && test -x start.command && test -x update.sh && test -x update.command

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag ultimate-animation-index:ci .

  verify:
    name: verify
    if: always()
    needs: [checks, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$CONTAINER_RESULT" = success
